name: Build and Deploy Static Site

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 1. 阻止 GitHub Pages/Jekyll 过滤 _ 开头的下划线目录
      - name: Create .nojekyll
        run: touch .nojekyll

      # 2. 执行你的索引生成脚本
      - name: Execute Build Script
        run: node build.js

      # 3. 将整个站点目录（含 _index_cache/）直接打包为 Pages 部署产物
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 4. 直接发布到 GitHub Pages 服务器，不向 Git 提交任何 commit
      - name: Deploy to GitHub Actions Pages
        id: deployment
        uses: actions/deploy-pages@v4
