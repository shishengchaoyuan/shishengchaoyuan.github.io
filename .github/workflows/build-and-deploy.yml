name: Build and Deploy Static Site

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Execute Build Script
        run: node build.js

      # 将上万个小文件压缩成单个文件，减轻 Git 压力
      - name: Archive Cache Files
        run: |
          if [ -d "_index_cache" ]; then
            tar -czf index_cache.tar.gz _index_cache/
          fi

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          
          # 提交 index.html 和压缩后的缓存文件
          git add index.html index_cache.tar.gz
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "build: update site index and cache archive [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
