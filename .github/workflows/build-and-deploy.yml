name: Build and Deploy Static Site

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 使用 GitHub Actions 官方缓存机制（不占用 Git 仓库提交）
      - name: Cache Indexing Data
        uses: actions/cache@v4
        with:
          path: _index_cache
          key: index-cache-${{ runner.os }}-${{ hashFiles('build.js') }}
          restore-keys: |
            index-cache-${{ runner.os }}-

      - name: Execute Build Script
        run: node build.js

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          
          # 只把生成/更新的 index.html 提交到 Git
          git add index.html
          
          if git diff --staged --quiet; then
            echo "No changes in index.html to commit."
          else
            git commit -m "build: update index.html [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
